name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker image
    uses: ./.github/workflows/build.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  ci:
    name: Continuous integration
    runs-on: ubuntu-latest
    needs: [docker]
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository }}:${{ needs.docker.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Restore dependency cache
        run: tar -xzf /target-cache.tar.gz

      - name: Format check
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --lib --tests --release --locked -- -D warnings

      - name: Build
        run: cargo build --lib --release --locked

      - name: Unit tests
        run: cargo test --release --locked

      - name: Integration tests (varnishtest)
        run: |
          cp target/release/libvmod_impress.so /usr/lib/varnish/vmods/
          varnishtest -v tests/*.vtc
