name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  docker:
    name: Docker image
    uses: ./.github/workflows/build.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    needs: [docker]
    timeout-minutes: 60
    permissions:
      contents: write
    container:
      image: ghcr.io/${{ github.repository }}:${{ needs.docker.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify Cargo.toml version matches tag
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag $TAG does not match Cargo.toml version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Restore dependency cache
        run: tar -xzf /target-cache.tar.gz

      - name: Build release artifact
        run: cargo build --lib --release --locked

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/libvmod_impress.so
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
