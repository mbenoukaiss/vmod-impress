services:
  vmod-impress:
    container_name: vmod-impress
    image: vmod-impress
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    user: ${USER_ID}:${GROUP_ID}
    ports: [21777:80]
    volumes:
      - .:/build:rw,cached
      - ./config:/etc/varnish:rw,cached
