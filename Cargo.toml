[package]
name = "vmod_impress"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
tempfile = "3"

[dependencies]
varnish = "0.5.5"
image = "0.25"
webp = "0.3"
libavif = "0.14"
#we deliberately don't enable turbojpeg's "image" feature: it would pin
#image 0.24 in this dep graph and conflict with image 0.25 elsewhere.
#src/images/jpeg.rs uses turbojpeg's lower-level Compressor/Image API.
turbojpeg = "1.4"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
walkdir = "2.5"
regex = "1.12"
log = "0.4"
log4rs = { version = "1.4", features = ["file_appender"] }
notify = "8"
rusty_pool = { version = "0.7", default-features = false }
urlencoding = "2.1"
headers-accept = "0.3"
mediatype = "0.21"
parking_lot = "0.12"
serde_json = "1.0.149"
oxc_minifier = "0.129.0"
oxc_allocator = "0.129.0"
oxc_parser = "0.129.0"
oxc_codegen = "0.129.0"
oxc_span = "0.129.0"
minify-html = "0.18.1"
lightningcss = "1.0.0-alpha.71"

[lib]
name = "vmod_impress"
path = "src/lib.rs"
crate-type = ["cdylib"]

#The #[varnish::vmod] proc macro generates extern "C" shims with no
#catch_unwind, so a Rust panic in user code propagates across the FFI
#boundary and aborts the varnishd child either way. Keeping panic at
#the default unwind here for conservatism and the ability to add a
#std::panic::catch_unwind boundary later; switching to panic = "abort"
#would also be safe and trim the .so a bit.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
debug = false
overflow-checks = false
incremental = false

#fast-iteration profile for local dev: thin LTO + parallel codegen
#keeps link times reasonable while still being a real release build.
[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "none"
debug = "line-tables-only"
