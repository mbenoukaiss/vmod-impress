[package]
name = "vmod_impress"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
tempfile = "3"

[dependencies]
varnish = "0.5.5"
image = "0.25"
webp = "0.3"
libavif = "0.14"
#we deliberately don't enable turbojpeg's "image" feature: it would pin
#image 0.24 in this dep graph and conflict with image 0.25 elsewhere.
#src/images/jpeg.rs uses turbojpeg's lower-level Compressor/Image API.
turbojpeg = "1.4"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
walkdir = "2.5"
regex = "1.12"
log = "0.4"
log4rs = { version = "1.4", features = ["file_appender"] }
notify = "8"
rusty_pool = { version = "0.7", default-features = false }
urlencoding = "2.1"
headers-accept = "0.3"
mediatype = "0.21"

[lib]
name = "vmod_impress"
path = "src/lib.rs"
crate-type = ["cdylib"]
